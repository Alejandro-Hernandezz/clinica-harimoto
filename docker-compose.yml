version: '3.8'

services:
  # PostgreSQL - Base de datos relacional
  postgres:
    image: postgres:15-alpine
    container_name: riego-smart-postgres
    environment:
      POSTGRES_USER: riego_admin
      POSTGRES_PASSWORD: riego_password_2024
      POSTGRES_DB: riego_smart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - riego-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riego_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: riego-smart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: riego_rabbit
      RABBITMQ_DEFAULT_PASS: rabbit_password_2024
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - riego-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache (opcional)
  redis:
    image: redis:7-alpine
    container_name: riego-smart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - riego-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - Administración de BD (opcional, para desarrollo)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: riego-smart-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@riego-smart.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_2024
    ports:
      - "5050:80"
    networks:
      - riego-network
    depends_on:
      - postgres

networks:
  riego-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
