version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: riego-smart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: riego_smart
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - riego-network
    command: --default-authentication-plugin=mysql_native_password

networks:
  riego-network:
    driver: bridge

volumes:
  mysql_data:
